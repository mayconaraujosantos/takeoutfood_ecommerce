server:
  port: 8080
  netty:
    connection-timeout: 10s
    idle-timeout: 60s

spring:
  application:
    name: api-gateway

  # Redis configuration - Simplified for reliability
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms

  cloud:
    gateway:
      # Discovery configuration -- every service reachable through the gateway is addressed as
      # /<service-id>/** (lower-cased Eureka id), full path forwarded unchanged. This used to
      # coexist with an explicit `routes:` list below (StripPrefix=3, no /<service-id> segment)
      # that's been removed: its StripPrefix math didn't line up with what the services'
      # controllers actually expect (@RequestMapping("/api/v1/restaurants") etc. wants the
      # full path, not what's left after stripping 3 segments), and -- as the properties served
      # from here take precedence over api-gateway's own application.yml -- its `default-filters`
      # (rate limiter + headers, no AuthFilter) silently replaced the gateway's own AuthFilter
      # wiring wholesale, so nothing here ever got a validated JWT or X-User-Id.
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # Applied to every discovery-locator route. AuthFilter validates the JWT and injects
      # X-User-Id/X-User-Email/X-User-Roles/X-Authenticated for downstream services'
      # GatewayUserContext; bypassPaths exempts the endpoints meant to be public (auth's own
      # SecurityConfig still protects login/register itself). Path-only match, no HTTP method
      # check -- tighten this before adding write endpoints under restaurants/menus (e.g. a
      # future restaurant-owner backoffice).
      default-filters:
        - name: AuthFilter
          args:
            requireAuth: true
            bypassPaths: >-
              /[^/]+/api/v1/auth/(login|register|refresh|health|password/reset.*|email/verify),
              /[^/]+/api/v1/restaurants(/.*)?,
              /[^/]+/api/v1/menus(/.*)?,
              /[^/]+/actuator/.*,
              /[^/]+/v3/api-docs.*,
              /[^/]+/swagger-ui.*
        - "DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin"
        - "AddResponseHeader=X-Gateway-Version, 1.0.0"
        # Dropped: "AddResponseHeader=X-Response-Time, #{T(System).currentTimeMillis()}".
        # T(...) type references aren't supported here at all -- ShortcutConfigurable.getValue
        # evaluates shorthand filter args with a bare SimpleEvaluationContext, which has no
        # type locator by design (fails with "EL1005E: Type cannot be found", fully-qualified
        # or not; this is a security-motivated SpEL restriction, not a typo). Crashed
        # api-gateway's route refresh on every boot once it ever actually loaded this far.
        # It also wouldn't have measured anything real even if it worked: shortcut args are
        # evaluated once when the route is built, not per-request.
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"

      # Global CORS configuration
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          "[/**]":
            allowCredentials: false
            allowedOriginPatterns:
              - "http://localhost:*"
              - "https://*.ifoodclone.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - X-Trace-ID
              - X-Gateway-Version
            maxAge: 3600

      # HTTP client configuration
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s
        pool:
          max-connections: 100
          acquire-timeout: 45000

# Circuit Breaker configuration
resilience4j:
  circuitbreaker:
    instances:
      auth-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      user-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      restaurant-service:
        sliding-window-size: 15
        minimum-number-of-calls: 8
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
      menu-service:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
      order-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 40
        wait-duration-in-open-state: 45s
      payment-service:
        sliding-window-size: 8
        minimum-number-of-calls: 4
        failure-rate-threshold: 30
        wait-duration-in-open-state: 60s
      delivery-service:
        sliding-window-size: 12
        minimum-number-of-calls: 6
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      review-service:
        sliding-window-size: 15
        minimum-number-of-calls: 8
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s

# SpringDoc: populate the Swagger UI dropdown with every downstream service's spec,
# served by OpenApiController (which proxies to each service's own /v3/api-docs).
springdoc:
  swagger-ui:
    urls:
      - name: auth-service-public
        url: /v3/api-docs/auth-service-public
      - name: auth-service-protected
        url: /v3/api-docs/auth-service-protected
      - name: user-service
        url: /v3/api-docs/user-service
      - name: restaurant-service
        url: /v3/api-docs/restaurant-service
      - name: menu-service
        url: /v3/api-docs/menu-service
      - name: order-service
        url: /v3/api-docs/order-service
      - name: payment-service
        url: /v3/api-docs/payment-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: delivery-service
        url: /v3/api-docs/delivery-service
      - name: review-service
        url: /v3/api-docs/review-service

# JWT configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890123456789012345678901234567890}
  expiration: 86400000 # 24 hours
  issuer: ifood-clone-api
  algorithm: HS512

# Logging configuration
logging:
  level:
    com.ifoodclone.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: DEBUG
    io.netty: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

# Management and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      show-components: always
    gateway:
      enabled: true
  health:
    redis:
      enabled: true
    diskspace:
      enabled: true
    ping:
      enabled: true
    defaults:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Gateway-specific monitoring
gateway:
  monitoring:
    enabled: true
    metrics:
      requests: true
      routes: true
      circuit-breakers: true
