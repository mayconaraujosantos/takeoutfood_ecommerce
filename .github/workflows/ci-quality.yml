name: CI Quality

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and run tests
        run: ./mvnw -B -ntp -DskipITs=true -DskipIT=true -DskipIntegrationTests=true clean verify

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            **/target/site/jacoco*/**
          if-no-files-found: ignore

  integration-test-auth:
    name: Integration Test Auth Service
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run integration tests with Testcontainers (auth-service)
        run: ./mvnw -B -ntp -pl auth-service -am failsafe:integration-test failsafe:verify

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-auth-reports
          path: |
            auth-service/target/failsafe-reports/*.xml
            auth-service/target/site/jacoco*/**
          if-no-files-found: ignore

  integration-test-user:
    name: Integration Test User Service
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run integration tests with Testcontainers (user-service)
        run: ./mvnw -B -ntp -pl user-service -am failsafe:integration-test failsafe:verify

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-user-reports
          path: |
            user-service/target/failsafe-reports/*.xml
            user-service/target/site/jacoco*/**
          if-no-files-found: ignore

  integration-test-order:
    name: Integration Test Order Service
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run integration tests with Testcontainers (order-service)
        run: ./mvnw -B -ntp -pl order-service -am failsafe:integration-test failsafe:verify

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-order-reports
          path: |
            order-service/target/failsafe-reports/*.xml
            order-service/target/site/jacoco*/**
          if-no-files-found: ignore

  sonar:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    needs:
      - build-test
      - integration-test-auth
      - integration-test-user
      - integration-test-order
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Check Sonar configuration
        id: sonar_check
        shell: bash
        run: |
          if [[ -n "${SONAR_TOKEN}" && -n "${SONAR_HOST_URL}" && -n "${SONAR_PROJECT_KEY}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Sonar secrets not fully configured. Skipping Sonar analysis."
          fi

      - name: Sonar scan with Quality Gate
        if: steps.sonar_check.outputs.enabled == 'true'
        run: |
          ./mvnw -B -ntp -DskipTests \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
