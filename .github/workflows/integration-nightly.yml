name: Integration Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration-matrix:
    name: Nightly Integration ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            module: auth-service
          - service: user-service
            module: user-service
          - service: order-service
            module: order-service

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run integration tests with Testcontainers
        run: ./mvnw -B -ntp -pl ${{ matrix.module }} -am failsafe:integration-test failsafe:verify

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-${{ matrix.service }}-reports
          path: |
            ${{ matrix.module }}/target/failsafe-reports/*.xml
            ${{ matrix.module }}/target/site/jacoco*/**
          if-no-files-found: ignore
