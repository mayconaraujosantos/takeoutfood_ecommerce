name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "config-server/**"
      - "service-discovery/**"
      - "api-gateway/**"
      - "auth-service/**"
      - "user-service/**"
      - "restaurant-service/**"
      - "menu-service/**"
      - "order-service/**"
      - "payment-service/**"
      - "notification-service/**"
      - "delivery-service/**"
      - "review-service/**"
      - "pom.xml"
      - ".github/workflows/ci-cd.yml"

env:
  REGISTRY: ghcr.io
  SERVICES: >-
    config-server service-discovery api-gateway auth-service user-service
    restaurant-service menu-service order-service payment-service
    notification-service delivery-service review-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Run test suite (full reactor)
        run: ./mvnw -B test

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build all JARs
        run: ./mvnw -B clean package -DskipTests
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push each service image
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            image="$REGISTRY/${{ github.repository }}/$svc"
            echo "==> Building and pushing $image:${{ github.sha }}"
            docker buildx build \
              -f "$svc/Dockerfile" \
              -t "$image:${{ github.sha }}" \
              -t "$image:main" \
              --push \
              .
          done

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tags in gitops values to this commit's SHA
        run: |
          set -euo pipefail
          for f in gitops/apps/services/values/*.yaml; do
            sed -i -E "s|^(  tag: ).*|\1${{ github.sha }}|" "$f"
          done
      - name: Commit and push (Argo CD picks this up automatically)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/services/values/*.yaml
          if git diff --cached --quiet; then
            echo "No tag changes to commit"
          else
            git commit -m "chore(gitops): bump service image tags to ${{ github.sha }}"
            git push
          fi
