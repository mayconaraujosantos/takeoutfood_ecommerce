spring:
  application:
    name: delivery-service
  profiles:
    active: docker
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
  cloud:
    config:
      enabled: true
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: false
      retry:
        initial-interval: 2000
        max-attempts: 6
        max-interval: 10000
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/ifood_db}
    username: ${DB_USERNAME:ifood_user}
    password: ${DB_PASSWORD:ifood_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      group-id: delivery-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ifoodclone.delivery.event"
        # order-service's producer tags messages with its own event class's FQCN
        # (com.ifoodclone.order.event...), which doesn't exist in this service --
        # ignore that header and always deserialize into our own local copy of the
        # event shape instead (no shared module between services, JSON is the contract).
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.ifoodclone.delivery.event.OrderStatusChangedEvent

server:
  port: 8088

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://service-discovery:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

  # OpenTelemetry Tracing Configuration
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # 100% sampling for development
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces

logging:
  level:
    com.ifoodclone: DEBUG
    org.springframework.cloud: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] [%X{correlationId:-},%X{requestId:-}] %logger{36} - %msg%n"
