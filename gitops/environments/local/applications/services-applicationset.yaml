# One Application per file under gitops/apps/services/values/*.yaml, all
# rendered from the shared gitops/charts/microservice chart. Add a new
# service by dropping a values file there - no edits needed here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ifood-services
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/mayconaraujosantos/takeoutfood_ecommerce.git
        revision: main
        files:
          - path: "gitops/apps/services/values/*.yaml"
  template:
    metadata:
      name: "svc-{{path.basenameNormalized}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/mayconaraujosantos/takeoutfood_ecommerce.git
        targetRevision: main
        path: gitops/charts/microservice
        helm:
          valueFiles:
            - "../../apps/services/values/{{path.basename}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: services
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
