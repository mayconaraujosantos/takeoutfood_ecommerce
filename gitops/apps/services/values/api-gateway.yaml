nameOverride: api-gateway

image:
  repository: ghcr.io/mayconaraujosantos/takeoutfood_ecommerce/api-gateway
  tag: 90efa3c258a128dcf9c387eae6b36aa344b3a147

service:
  port: 8080
  targetPort: 8080

# Only service in the fleet exposed outside the cluster -- everything else stays ClusterIP-only
# and is reached through this gateway. Access locally via `minikube ip` mapped to this host in
# /etc/hosts (minikube has no real LoadBalancer, so the ingress-nginx addon is reached through
# the node IP directly).
ingress:
  enabled: true
  className: nginx
  host: ifood.local

env:
  # Must match auth-service's JWT_SECRET exactly -- the gateway's AuthFilter validates
  # tokens auth-service issues, and with no shared secret each service falls back to its
  # own different default, so every token fails signature validation at the gateway.
  JWT_SECRET: YWxsYW5lc3BlcmF2YW1vc3F1ZXNlamlhZm9yZXRlc29tcGVzc29hbHZhcnJhem9hYmVsZGFzaXZh
  REDIS_HOST: redis-master
  REDIS_PORT: "6379"
  REDIS_USER: ifood_user
  REDIS_PASSWORD: ifood_redis_pass
  SPRING_DATA_REDIS_HOST: redis-master
  SPRING_DATA_REDIS_PORT: "6379"
