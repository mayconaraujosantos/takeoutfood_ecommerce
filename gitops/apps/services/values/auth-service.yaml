nameOverride: auth-service
springProfile: dev

image:
  repository: localhost/ifood-clone/auth-service
  tag: local

service:
  port: 8081
  targetPort: 8081

env:
  DATABASE_URL: jdbc:postgresql://postgres:5432/ifood_db
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ifood_db
  DB_USER: ifood_user
  DB_PASSWORD: ifood_pass
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_USER: ifood_user
  REDIS_PASSWORD: ifood_redis_pass
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
