# NOTE: kube-prometheus-stack / loki / promtail are fast-moving community charts.
# Versions in Chart.yaml are caret ranges; run `helm dependency update gitops/apps/observability`
# and adjust the range if resolution fails, then re-check the keys below against
# `helm show values <repo>/<chart>` for that resolved version.

kube-prometheus-stack:
  enabled: true
  fullnameOverride: kube-prometheus-stack
  # These CRDs (esp. Prometheus/Alertmanager/ThanosRuler/PrometheusAgent) are large enough
  # that any tool which stuffs a full copy of the object into an annotation (Helm/ArgoCD's
  # apply pipeline for the chart's crds/ folder does this regardless of ServerSideApply=true
  # on the Application) trips the 262144-byte kubectl.kubernetes.io/last-applied-configuration
  # limit. Managed out of band instead: applied once with
  # `kubectl apply --server-side -f <rendered CRDs>`, which never sets that annotation.
  # Re-run that after bumping the chart version if the CRDs change upstream.
  crds:
    enabled: false
  grafana:
    enabled: true
    adminPassword: ifood_grafana_pass
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
      datasources:
        enabled: true
        label: grafana_datasource
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m
  prometheus:
    prometheusSpec:
      retention: 3d
      resources:
        requests:
          memory: 256Mi
          cpu: 250m
        limits:
          memory: 512Mi
          cpu: 500m
      # Pick up ServiceMonitors from every namespace (the microservice chart's
      # ServiceMonitors live in the "services" namespace, not "observability").
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
  alertmanager:
    enabled: true
  nodeExporter:
    enabled: true
  kubeStateMetrics:
    enabled: true

loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 250m
  # Self-monitoring tries to install the Grafana Agent Operator and its CRDs by default,
  # which we don't use (metrics/logs already flow through kube-prometheus-stack + promtail).
  # Left enabled it renders a GrafanaAgent CR with no matching CRD, and duplicates the
  # podmonitors/probes/servicemonitors CRDs that kube-prometheus-stack already installs.
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false
  # Depends on selfMonitoring + lokiCanary, both disabled above.
  test:
    enabled: false
  # These distributed-mode components are unused in SingleBinary deployment mode.
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# Consumed by this chart's own templates (not a subchart).
jaeger:
  enabled: true
  image: jaegertracing/all-in-one:1.49
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

otelCollector:
  enabled: true
  image: otel/opentelemetry-collector-contrib:0.103.0
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
