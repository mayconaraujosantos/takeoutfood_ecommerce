spring:
  application:
    name: review-service
  profiles:
    active: docker
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}"
  cloud:
    config:
      enabled: true
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: false
      retry:
        initial-interval: 2000
        max-attempts: 6
        max-interval: 10000
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ifood_reviews}

server:
  port: 8089

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://service-discovery:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

  # OpenTelemetry Tracing Configuration
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # 100% sampling for development
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces

logging:
  level:
    com.ifoodclone: DEBUG
    org.springframework.cloud: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] [%X{correlationId:-},%X{requestId:-}] %logger{36} - %msg%n"
