server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: false
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      enabled: true
      uri: ${CONFIG_SERVER_URL:http://localhost:8888}
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      metrics:
        enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: false
      # Applies AuthFilter to every discovery-locator route (auth-service, restaurant-service,
      # etc.) since discovery.locator has no filters of its own. bypassPaths exempts the
      # currently-public golden-path endpoints (auth's own SecurityConfig still protects
      # login/register properly; this bypass only skips the gateway's identity-header injection
      # for them). Path-only match, no HTTP method check -- see AuthFilter.java's known
      # limitation before adding write endpoints under restaurants/menus.
      default-filters:
        - name: AuthFilter
          args:
            requireAuth: true
            bypassPaths: >-
              /[^/]+/api/v1/auth/(login|register|refresh|health|password/reset.*|email/verify),
              /[^/]+/api/v1/restaurants(/.*)?,
              /[^/]+/api/v1/menus(/.*)?,
              /[^/]+/actuator/.*,
              /[^/]+/v3/api-docs.*,
              /[^/]+/swagger-ui.*
      routes:
        # Health endpoint for testing without config server
        - id: gateway-health
          uri: http://localhost:8080
          predicates:
            - Path=/api/health,/api/info,/api/routes
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:ifood_redis_pass}
      timeout: 2s
      connect-timeout: 2s

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890123456789012345678901234567890}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always

  # OpenTelemetry Tracing Configuration
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # 100% sampling for development
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces

logging:
  level:
    '[com.ifoodclone.gateway]': INFO
    '[org.springframework.cloud.gateway]': INFO
    '[org.springframework.cloud.netflix.eureka]': DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
